name: commit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ">=1.26.5"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  lint-dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.3.0

  test:
    runs-on: ubuntu-latest
    env:
      CONFIG_PATH: "${{ github.workspace }}/config/config.yaml"
      CGO_ENABLED: "0"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ">=1.26.5"

      - name: test
        run: go test -coverprofile=coverage.txt -v ./...

      - uses: actions/upload-artifact@v7
        with:
          name: test-coverage
          path: ./coverage.txt
          if-no-files-found: error

  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: test-coverage
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: astro:image-check
      - run: sh scripts/test-image.sh astro:image-check

  transfer-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14.4
        ports:
          - 5432/tcp
        env:
          POSTGRES_DB: astro_transfer
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ">=1.26.5"
      - run: go test -count=1 -tags=transfer_integration ./internal/transfer ./cmd/transfer
        env:
          ASTRO_TRANSFER_TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/astro_transfer?sslmode=disable

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gitleaks, lint-go, lint-dockerfile, test, coverage, image, transfer-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: joaofnds/semantic-release-action@v1.4.0
        with:
          plugins: conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
