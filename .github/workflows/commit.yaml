name: commit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1

  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  lint-dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0

  test:
    runs-on: ubuntu-latest
    env:
      CONFIG_PATH: "${{ github.workspace }}/config/config.yaml"
      CGO_ENABLED: "0"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: test
        run: go test -coverprofile=coverage.txt -v ./...

      - name: Check Mage tooling
        run: |
          go -C magefiles test -tags=mage ./...
          go -C magefiles run main.go -l

      - uses: actions/upload-artifact@v7
        with:
          name: test-coverage
          path: ./coverage.txt
          if-no-files-found: error

  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: test-coverage
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: astro:image-check
      - run: sh scripts/test-image.sh astro:image-check

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gitleaks, lint-go, lint-dockerfile, test, coverage, image]
    runs-on: ubuntu-latest
    steps:
      - uses: joaofnds/semantic-release-action@v1.5.0
        with:
          version: 25.0.9
          plugins: conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
