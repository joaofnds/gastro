app = "gastro"
primary_region = "ams"
kill_signal = "SIGINT"
kill_timeout = 60

[env]
  CONFIG_PATH = ""
  ENV = "production"
  HTTP_PORT = "8080"
  METRICS_ADDRESS = "0.0.0.0:9091"
  HTTP_LIMITER_REQUESTS = "120"
  HTTP_LIMITER_EXPIRATION = "60s"
  SQLITE_PATH = "/data/astro.db"
  LITESTREAM_REPLICA_URL = "s3://gastro-sqlite-backups/gastro/production?endpoint=t3.storage.dev&region=auto"

[deploy]
  strategy = "rolling"
  wait_timeout = "5m"

[[mounts]]
  source = "astro_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "30s"
    restart_limit = 0

  [[services.http_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "30s"
    restart_limit = 0
    method = "get"
    path = "/health"
    protocol = "http"

[[metrics]]
  port = 9091
  path = "/metrics"
